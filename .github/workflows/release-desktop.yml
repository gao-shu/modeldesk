# Build desktop installers, publish GitHub Release,
# then optionally sync the same assets to Gitee Releases.
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0
#   or Actions → Release desktop → Run workflow (tag + platforms)
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   GITEE_TOKEN / GITEE_OWNER / GITEE_REPO
# See docs/RELEASE.md

name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v0.1.0)"
        required: true
        type: string
      platforms:
        description: "Which installers to build"
        required: true
        type: choice
        options:
          - windows
          - macos
          - all
        default: windows

concurrency:
  group: release-desktop-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve tag and matrix
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PLATFORMS="${{ inputs.platforms }}"
          else
            TAG="${{ github.ref_name }}"
            # Tag push: Windows only for now (skip macOS). Re-enable with all later.
            PLATFORMS="windows"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v0.1.0 (got: $TAG)" >&2
            exit 1
          fi

          WINDOWS='{"os":"windows-latest","rust_target":"","node_platform":"win-x64","artifact_name":"windows-x64"}'
          MAC_ARM='{"os":"macos-latest","rust_target":"aarch64-apple-darwin","node_platform":"darwin-arm64","artifact_name":"macos-aarch64"}'
          MAC_X64='{"os":"macos-latest","rust_target":"x86_64-apple-darwin","node_platform":"darwin-x64","artifact_name":"macos-x64"}'

          case "$PLATFORMS" in
            windows) MATRIX="[$WINDOWS]" ;;
            macos) MATRIX="[$MAC_ARM,$MAC_X64]" ;;
            all) MATRIX="[$WINDOWS,$MAC_ARM,$MAC_X64]" ;;
            *)
              echo "Unknown platforms: $PLATFORMS" >&2
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (platforms=$PLATFORMS)"

  build:
    name: build (${{ matrix.artifact_name }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installer
        env:
          MODELDESK_NODE_PLATFORM: ${{ matrix.node_platform }}
        shell: bash
        run: |
          set -euo pipefail
          # Pass --target to the Tauri CLI (not cargo via `--`), so the bundler
          # looks under target/<triple>/release instead of target/release.
          if [ -n "${{ matrix.rust_target }}" ]; then
            pnpm --filter @modeldesk/desktop exec tauri build --target "${{ matrix.rust_target }}"
          else
            pnpm --filter @modeldesk/desktop exec tauri build
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${TAG#v}"
          ARTIFACT="${{ matrix.artifact_name }}"
          find apps/desktop/src-tauri/target -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -path '*/bundle/*' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            case "$ARTIFACT" in
              windows-x64)
                cp -f "$f" "dist-release/ModelDesk-${VER}-win-x64-setup.exe"
                ;;
              macos-aarch64)
                cp -f "$f" "dist-release/ModelDesk-${VER}-mac-arm64.dmg"
                ;;
              macos-x64)
                cp -f "$f" "dist-release/ModelDesk-${VER}-mac-x64.dmg"
                ;;
              *)
                cp -f "$f" dist-release/
                ;;
            esac
          done
          echo "Collected:"
          ls -lah dist-release
          test "$(ls -A dist-release 2>/dev/null)" || { echo "No installer artifacts found"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: modeldesk-${{ matrix.artifact_name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: modeldesk-*
          merge-multiple: true

      - name: Generate auto release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          # Best-effort compare with previous tag; empty file is fine.
          PREV="$(gh release list --limit 20 --json tagName -q '.[].tagName' | grep -E '^v' | grep -vx "$TAG" | head -n1 || true)"
          if [ -n "$PREV" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREV" \
              --jq .body > auto-notes.md || echo "" > auto-notes.md
          else
            echo "" > auto-notes.md
          fi
          echo "prev=${PREV:-none}"

      - name: Prepare ToonFlow-style assets + body
        run: node scripts/prepare-release-assets.mjs --tag "${{ needs.meta.outputs.tag }}" --dir release-assets --notes auto-notes.md

      - name: List assets
        run: ls -lah release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ModelDesk ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          body_path: RELEASE_BODY.md
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.msi
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitee-sync:
    name: Sync to Gitee
    needs: [meta, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: modeldesk-*
          merge-multiple: true

      - name: Prepare ToonFlow-style assets + body
        run: node scripts/prepare-release-assets.mjs --tag "${{ needs.meta.outputs.tag }}" --dir release-assets

      - name: Sync assets to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TARGET_COMMITISH: ${{ vars.GITEE_TARGET_COMMITISH || 'main' }}
          GITEE_TAG: ${{ needs.meta.outputs.tag }}
        run: node scripts/sync-gitee-release.mjs --tag "$GITEE_TAG" --dir release-assets
