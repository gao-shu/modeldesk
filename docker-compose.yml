# Local Docker deploy: web (Next)
# Usage:
#   cp .env.docker.example .env.docker   # edit ENCRYPTION_SECRET — never commit .env.docker
#   docker compose --env-file .env.docker up --build -d
# Open http://127.0.0.1:${WEB_HOST_PORT:-3020}
# Container binds 0.0.0.0; do NOT publish host ports to the public internet.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: modeldesk-web:local
    container_name: modeldesk-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3020"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      MODELDESK_DATA_DIR: /data
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET in .env.docker}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ModelDesk}
      # Optional TOS (Agnes / public URLs)
      TOS_BUCKET: ${TOS_BUCKET:-}
      TOS_ENDPOINT: ${TOS_ENDPOINT:-}
      TOS_REGION: ${TOS_REGION:-}
      TOS_ACCESS_KEY: ${TOS_ACCESS_KEY:-}
      TOS_SECRET_KEY: ${TOS_SECRET_KEY:-}
      TOS_PUBLIC_BASE_URL: ${TOS_PUBLIC_BASE_URL:-}
    volumes:
      - ./data:/data
    ports:
      - "${WEB_HOST_PORT:-3020}:3020"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3020/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
