[package]
name = "modeldesk"
version = "0.1.0"
description = "ModelDesk — local multimodal API desk"
authors = ["ModelDesk"]
edition = "2021"

[lib]
name = "modeldesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
