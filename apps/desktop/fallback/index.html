<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ModelDesk</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --fg: #18181b;
        --muted: #71717a;
        --teal: #0d9488;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .card {
        width: min(360px, calc(100vw - 48px));
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: var(--teal);
        color: #fff;
        font-weight: 800;
        font-size: 28px;
        line-height: 56px;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 650;
      }
      #status {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
        min-height: 1.4em;
      }
      .bar {
        margin: 22px auto 0;
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: #e4e4e7;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: var(--teal);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">M</div>
      <h1>ModelDesk</h1>
      <p id="status">正在启动…</p>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>
    <script>
      const statusEl = document.getElementById("status");
      const started = Date.now();
      // After install-time extract, boot is usually a few seconds.
      const stages = [
        [0, "正在启动…"],
        [6000, "正在加载界面…"],
        [15000, "仍在启动，请稍候…"],
      ];
      setInterval(() => {
        const elapsed = Date.now() - started;
        let text = stages[0][1];
        for (const [t, s] of stages) {
          if (elapsed >= t) text = s;
        }
        statusEl.textContent = text;
      }, 400);

      const tick = () =>
        fetch("http://127.0.0.1:3300/", { mode: "no-cors" })
          .then(() => {
            location.replace("http://127.0.0.1:3300/");
          })
          .catch(() => setTimeout(tick, 400));
      setTimeout(tick, 200);
    </script>
  </body>
</html>
